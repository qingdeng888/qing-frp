; ============================================================================
;  supervisord 主配置（容器内）
; ----------------------------------------------------------------------------
;  仅负责守护 frps。面板进程由容器的 CMD 直接运行，这样它的日志直接进入
;  `docker logs`，而不是被 supervisor 再包一层。
;
;  容器内 PID 1 不是 systemd，因此面板通过 FRP_CONSOLE_SERVICE_MANAGER=supervisor
;  使用 supervisorctl 来重启 frps。
; ============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/frps/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/frps

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; frps 的实际定义由包含目录提供，面板部署时会写入 /etc/supervisor/conf.d/frps.conf
[include]
files = /etc/supervisor/conf.d/*.conf
