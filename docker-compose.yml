# ============================================================================
#  frp-console — Docker Compose 部署（host 网络模式）
# ----------------------------------------------------------------------------
#  快速开始：
#    1. 配置密码与公网地址（必须）
#    2. docker compose up -d --build
#    3. 浏览器打开 http://<服务器IP>:37000 ，用 admin / <密码> 登录
#
#  为什么用 host 网络？
#    frps 需要监听任意端口范围（allowPorts，例如 20000-30000）。bridge 模式
#    下每个端口都要单独写一条 -p 映射，一万个端口不可维护；host 模式下容器
#    直接使用宿主机网络，范围端口自动生效。
# ============================================================================

services:
  frp-console:
    build:
      context: .
      dockerfile: Dockerfile
      # 国内网络构建时可切换镜像源（默认官方源）。
      # 在 .env 中设置，例如：
      #   NPM_REGISTRY=https://registry.npmmirror.com
      #   APK_MIRROR=mirrors.aliyun.com
      #   BASE_IMAGE=docker.m.daocloud.io/library/node:22-alpine
      args:
        BASE_IMAGE: "${BASE_IMAGE:-node:22-alpine}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
        APK_MIRROR: "${APK_MIRROR:-}"
        # 版本标签：compose 会自动读取项目根的 .env；此处从 .env 或
        # 环境变量取值。留空也可以——容器内 /api/health 与 /app/VERSION
        # 始终返回真实版本（读自 package.json）。
        APP_VERSION: "${APP_VERSION:-}"
    image: frp-console:latest
    container_name: frp-console
    restart: unless-stopped

    # ------------------------------------------------------------ 网络模式
    # host：容器直接使用宿主机网络，frps 的端口范围无需逐一映射。
    # 代价：没有网络隔离，端口直接暴露在宿主机上（需自行配置防火墙）。
    network_mode: host

    # host 模式下 ports 段会被忽略，因此不再声明端口映射。
    # 监听端口（可用环境变量覆盖）：
    #   37000  面板 Web 界面          （FRP_CONSOLE_PORT / PANEL_PORT）
    #   37001  frps 控制端口          （frps.toml 的 bindPort，在面板中修改）
    #   37002  frps 内置 Dashboard    （未启用则不监听）
    # 穿透的业务端口由 frps 的 allowPorts 决定，同样直接监听宿主机。

    environment:
      # ---------------------------------------------------------- 面板登录
      # ⚠ 生产环境务必修改密码
      FRP_CONSOLE_USER: "${PANEL_USER:-admin}"
      FRP_CONSOLE_PASSWORD: "${PANEL_PASSWORD:-changeme}"
      # host 模式下该端口即宿主机端口
      FRP_CONSOLE_PORT: "${PANEL_PORT:-37000}"
      FRP_CONSOLE_HOST: "0.0.0.0"

      # ------------------------------------------------ 面板对外地址（重要）
      # 生成的一键安装脚本会把该地址写入节点，供节点回连（心跳上报、
      # --refresh 拉取配置）。必须是节点能访问到的地址。
      # 留空会探测到宿主机内网 IP —— 外部节点可能连不上。
      FRP_CONSOLE_PUBLIC_URL: "${PUBLIC_URL:-}"

      # ---------------------------------------------------------- 服务管理
      # 容器内 PID 1 不是 systemd，使用 supervisord 守护 frps。
      FRP_CONSOLE_SERVICE_MANAGER: "supervisor"
      # 设为 0 可关闭 frps 托管（仅用面板管理节点与生成脚本）
      FRP_CONSOLE_SUPERVISOR: "1"

      # ------------------------------------------------------------ 路径
      FRP_CONSOLE_HOME: "/data"
      FRP_CONSOLE_FRPS_CONFIG: "/etc/frp/frps.toml"
      FRP_CONSOLE_FRPS_BIN: "/usr/local/bin/frps"
      FRP_CONSOLE_SUPERVISOR_INCLUDE: "/etc/supervisor/conf.d"
      FRP_CONSOLE_SUPERVISOR_LOG: "/var/log/frps"

      # -------------------------------------------------- GitHub 代理/镜像
      # 仅影响面板「定制构建」拉取源码；节点分发不走 GitHub。
      GITHUB_PROXY: "${GITHUB_PROXY:-}"
      GOPROXY: "${GOPROXY:-}"

      TZ: "${TZ:-Asia/Shanghai}"

    volumes:
      # 面板数据（SQLite、登录会话、frp 二进制缓存）
      - frp-console-data:/data
      # frps 配置：想手工编辑配置时把它映射到宿主机
      - ./data/frps:/etc/frp
      # frps 日志
      - ./data/logs:/var/log/frps

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PANEL_PORT:-37000}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # frps 需要接受大量连接，放宽文件描述符限制
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  frp-console-data:
    driver: local
