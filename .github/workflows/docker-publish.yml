# ============================================================================
#  构建并发布 Docker 镜像到 GitHub Container Registry (ghcr.io)
# ----------------------------------------------------------------------------
#  触发时机：
#    - 推送到 main 分支
#    - 推送 v* 标签（如 v0.0.1）
#    - 手动触发（Actions 页面 Run workflow）
#    - Pull Request（仅构建验证，不推送）
#
#  产物：
#    ghcr.io/<owner>/<repo>:latest        （默认分支）
#    ghcr.io/<owner>/<repo>:main          （分支名）
#    ghcr.io/<owner>/<repo>:0.0.1         （语义化标签）
#    ghcr.io/<owner>/<repo>:0.0           （主次版本）
#    ghcr.io/<owner>/<repo>:sha-xxxxxxx   （每次提交，便于回溯）
#
#  支持架构：linux/amd64、linux/arm64
#
#  关于重试：构建需要从 npm / apk 拉取依赖，网络抖动较常见。因此构建步骤
#  内置最多 3 次重试（退避等待后重跑），而不是一次失败就中断整个工作流。
#
#  首次发布后需在仓库页面把该 Package 设为 Public（若希望匿名拉取）：
#    https://github.com/users/<owner>/packages/container/<repo>/settings
# ============================================================================

name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: '忽略缓存，完全重新构建'
        type: boolean
        default: false

# 同一分支/标签只保留最新一次构建，旧的自动取消
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io 要求镜像名全小写，github.repository 已是 owner/repo 形式
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read # 读取源码
      packages: write # 推送到 ghcr.io

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "面板版本: ${VERSION}"

      # arm64 构建需要 QEMU 模拟
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        # PR 来自 fork 时没有写权限，跳过登录（也就不会推送）
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=frp-console
            org.opencontainers.image.description=frps/frpc 管理面板（含定制版 frp，支持 Linux 6 架构与 Windows）
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: 构建并推送（最多重试 3 次）
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          APP_VERSION: ${{ steps.version.outputs.value }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          NO_CACHE: ${{ github.event.inputs.no_cache }}
        run: |
          # 注意：GitHub Actions 用 `bash -e` 执行 run 脚本，因此即便这里只写
          # `set -uo pipefail`，-e 依然是开着的。必须显式关掉，否则第一次
          # 构建失败就会立刻退出，重试与诊断分支都跑不到。
          set +e
          set -uo pipefail

          # ---- 组装 buildx 参数 ----
          ARGS=()
          ARGS+=(--build-arg "APP_VERSION=${APP_VERSION}")
          ARGS+=(--cache-from "type=gha,scope=frp-console")

          if [ "${NO_CACHE}" = "true" ]; then
            echo "手动触发：已开启 --no-cache"
            ARGS+=(--no-cache)
          else
            ARGS+=(--cache-to "type=gha,mode=max,scope=frp-console")
          fi

          # 多平台：同时产出 amd64 与 arm64
          ARGS+=(--platform linux/amd64,linux/arm64)

          # 标签
          while IFS= read -r tag; do
            [ -n "${tag}" ] && ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          # OCI 标签
          while IFS= read -r label; do
            [ -n "${label}" ] && ARGS+=(--label "${label}")
          done <<< "${LABELS}"

          # PR 只做构建验证（多平台产物无法 --load 到本地，故用 cache-only 导出）
          if [ "${IS_PR}" = "true" ]; then
            echo "Pull Request：仅构建验证，不推送"
            ARGS+=(--output "type=cacheonly")
          else
            ARGS+=(--push)
          fi

          echo "镜像标签："
          echo "${TAGS}" | sed 's/^/  - /'
          echo

          # ---- 推送前预检 ----
          # 重试只对「网络抖动」有意义。若是权限问题（例如 ghcr 上已存在一个
          # 同名但未关联本仓库的包），重试 3 次纯属浪费 5 分钟且报错依旧含糊，
          # 因此先探测一次，把问题在构建前就讲清楚。
          if [ "${IS_PR}" != "true" ]; then
            echo "推送权限预检：${REGISTRY}/${IMAGE_NAME}"
            if ! docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest" >/dev/null 2>&1; then
              echo "  （远端暂无该镜像，属首次发布）"
            fi
          fi

          # ---- 带重试的构建 ----
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "=============================================================="
            echo "构建尝试 ${attempt}/${MAX_ATTEMPTS}"
            echo "=============================================================="

            # 脚本开头是 `set -uo pipefail`（未启用 -e），这里显式捕获管道中
            # docker 自身的退出码，避免被 tee 的结果覆盖。
            docker buildx build "${ARGS[@]}" . 2>&1 | tee /tmp/build.log
            BUILD_STATUS=${PIPESTATUS[0]}

            if [ "${BUILD_STATUS}" -eq 0 ]; then
              echo "构建成功（第 ${attempt} 次尝试）"
              exit 0
            fi

            # 权限类错误重试无用，直接给出可操作的诊断后退出
            if grep -qE "permission_denied|denied: requested access|unauthorized" /tmp/build.log; then
              echo
              echo "=============================================================="
              echo "推送被拒绝（权限问题），重试无意义，已中止"
              echo "=============================================================="
              echo
              echo "最常见原因：ghcr 上已存在一个同名、但未关联到本仓库的包。"
              echo "GHCR 的包一旦创建，其归属就不会因仓库改名/重建而转移；"
              echo "此时本仓库的 GITHUB_TOKEN（即使 packages: write）也无权写入。"
              echo
              echo "请按顺序排查："
              echo "  1) 打开 https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE_NAME##*/}"
              echo "     若页面显示该包「未关联任何仓库」，说明属于这种情况。"
              echo "  2) 在包的 Settings → Manage Actions access 里，把本仓库"
              echo "     （${GITHUB_REPOSITORY}）添加为 Write 权限；或"
              echo "  3) 直接删除该孤立包后重跑本工作流；或"
              echo "  4) 改用其他镜像名（仓库 Settings → Variables 里覆盖 IMAGE_NAME 亦可）。"
              echo
              echo "注：包一旦被本仓库成功推送过一次，之后就会自动关联，不再需要上述操作。"
              exit 1
            fi

            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              # 其余（多为网络类）失败，退避后重试
              BACKOFF=$((attempt * 20))
              echo "第 ${attempt} 次构建失败，${BACKOFF}s 后重试..."
              sleep "${BACKOFF}"
            fi
          done

          echo "已重试 ${MAX_ATTEMPTS} 次仍失败"
          exit 1

      - name: 写入构建摘要
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Docker 镜像已发布"
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 面板版本 | \`${{ steps.version.outputs.value }}\` |"
            echo "| 架构 | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo
            echo "**标签**"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "**拉取**"
            echo
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
